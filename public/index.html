<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE整体院｜空き時間確認</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f5eee5;
  color: #5b4032;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.6;
}
.page { width: min(96vw, 720px); margin: 0 auto; padding: 12px 0 60px; }
.header { text-align: center; margin-bottom: 12px; padding: 0 6px; }
.header h1 { margin: 0; font-size: 19px; font-weight: 700; white-space: nowrap; }
.card { background: #fffaf5; border: 1px solid #d5c1ae; border-radius: 14px; padding: 16px; margin-bottom: 14px; }

.legend { display: flex; justify-content: center; gap: 20px; margin: 14px 0; font-size: 13px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.status-circle { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 15px; flex: 0 0 26px; }
.available { background: #e9f4ed; color: #397354; }
.full { background: #eee; color: #999; }

.loading, .error { padding: 20px; text-align: center; border-radius: 12px; }
.loading { color: #80695b; }
.error { background: #fdf0ee; color: #a9493d; border: 1px solid #eecac4; }

.contact-area { display: flex; gap: 10px; margin-top: 20px; }
.contact-button { flex: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 11px; text-decoration: none; font-weight: 700; }
.contact-button.line { background: #06c755; color: white; }

.admin-link-area { text-align: center; margin-top: 22px; }
.admin-link { font-size: 12px; color: #a89383; text-decoration: none; }

/* 週間予約票 */
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.week-label { font-size: 12px; font-weight: 700; color: #80695b; }
.small-button { padding: 9px 11px; border: 1px solid #d5c1ae; border-radius: 8px; background: #fff; color: #5b4032; font-weight: 700; cursor: pointer; }
.week-table-wrap { width: 100%; overflow-x: auto; }
.week-table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; font-size: 10px; }
.week-table th, .week-table td { border: 1px solid #d8c8bb; text-align: center; padding: 0; }
.week-table th { height: 34px; background: #9d574c; color: white; font-weight: 700; font-size: 10px; }
.week-table th:first-child { width: 44px; }
.week-table td { height: 26px; font-weight: 800; font-size: 12px; }
.time-cell { background: #fff7f0; color: #5b4032; font-size: 9px; }
.cell-ok { background: #e9f4ed; color: #397354; }
.cell-consult { background: #e9f4ed; color: #5b4032; font-size: 8px; font-weight: 700; }
.cell-ng { background: #f2dfdc; color: #a9493d; }
.cell-closed { background: #eee; color: #999; font-size: 9px; }
.week-note { margin-top: 7px; text-align: center; font-size: 10px; color: #80695b; }

/* 印刷時だけ表示するラベル（画面上は上部の週ナビに同じ日付が出ているため非表示） */
.print-only { display: none; }

@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; top: 0; left: 0; width: 100%; }
  #printArea .week-table { font-size: 11px; }
  #printArea .week-table th, #printArea .week-table td { height: 30px; }
  .print-only { display: block; }
  @page { size: A4 portrait; margin: 12mm; }
}
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <h1>東村山LIFE整体院 週間予約確認表</h1>
  </header>

  <div class="card">
    <div class="week-nav">
      <button id="prevWeek" class="small-button" type="button">‹ 前週</button>
      <div id="weekLabel" class="week-label"></div>
      <button id="nextWeek" class="small-button" type="button">次週 ›</button>
    </div>

    <div id="printArea">
      <div id="printWeekLabel" class="print-only" style="text-align:center;font-size:13px;margin-bottom:8px;"></div>
      <div class="week-table-wrap">
        <table class="week-table">
          <thead><tr id="weekHead"></tr></thead>
          <tbody id="weekBody">
            <tr><td colspan="8">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="legend">
    <div class="legend-item"><span class="status-circle available">○</span><span>予約可能</span></div>
    <div class="legend-item"><span class="status-circle full">×</span><span>予約不可</span></div>
  </div>

  <div class="contact-area">
    <a class="contact-button line" href="https://lin.ee/61mRZYN" target="_blank" rel="noopener">LINEで予約・問い合わせ</a>
  </div>

  <div class="admin-link-area">
    <a href="/admin.html" class="admin-link">管理者画面</a>
  </div>

</div>

<script>
'use strict';

const weekHead = document.getElementById('weekHead');
const weekBody = document.getElementById('weekBody');
const weekLabel = document.getElementById('weekLabel');
const printWeekLabelEl = document.getElementById('printWeekLabel');

const TIME_SLOTS = [];
for (let hour = 10; hour <= 21; hour++) {
  const minutes = hour === 21 ? [0] : [0, 30];
  minutes.forEach(m => TIME_SLOTS.push(String(hour).padStart(2, '0') + ':' + String(m).padStart(2, '0')));
}

function pad(n) { return String(n).padStart(2, '0'); }
function formatDate(date) { return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()); }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
function getMonday(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d;
}

let weekStart = getMonday(new Date());

async function fetchDay(date) {
  const response = await fetch('/api/availability/day?date=' + encodeURIComponent(formatDate(date)), { cache: 'no-store' });
  const result = await response.json();
  if (!response.ok || result.ok === false) throw new Error(result.error || '取得エラー');
  return result.data;
}

function renderWeekHead(dates) {
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  weekHead.innerHTML = '<th>時間</th>' +
    dates.map(d => '<th>' + (d.getMonth() + 1) + '/' + d.getDate() + '<br>' + weekdays[d.getDay()] + '</th>').join('');
}

async function loadWeek() {
  const dates = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  weekLabel.textContent = formatDate(dates[0]) + ' ～ ' + formatDate(dates[6]);
  if (printWeekLabelEl) {
    printWeekLabelEl.textContent = formatDate(dates[0]) + ' ～ ' + formatDate(dates[6]);
  }
  renderWeekHead(dates);
  weekBody.innerHTML = '<tr><td colspan="8">読み込み中…</td></tr>';

  try {
    const results = await Promise.all(dates.map(date => fetchDay(date)));
    weekBody.innerHTML = '';

    TIME_SLOTS.forEach(timeValue => {
      const tr = document.createElement('tr');
      const time = document.createElement('td');
      time.className = 'time-cell';
      time.textContent = timeValue;
      tr.appendChild(time);

      results.forEach((data, index) => {
        const td = document.createElement('td');
        const date = dates[index];

        if (date.getDay() === 0) {
          td.className = 'cell-closed';
          td.textContent = '休';
        } else if (!data || !data.found) {
          td.className = 'cell-closed';
          td.textContent = '－';
        } else {
          const slot = (data.slots || []).find(s => s.time === timeValue);
          const status = slot ? slot.status : 'full';
          if (status === 'available') {
            td.className = 'cell-ok';
            td.textContent = '○';
          } else if (status === 'consult') {
            td.className = 'cell-consult';
            td.textContent = '要相談';
          } else {
            td.className = 'cell-ng';
            td.textContent = '×';
          }
        }

        tr.appendChild(td);
      });

      weekBody.appendChild(tr);
    });

  } catch (error) {
    console.error('[LOAD WEEK ERROR]', error);
    weekBody.innerHTML = '<tr><td colspan="8">週間情報を取得できませんでした</td></tr>';
  }
}

document.getElementById('prevWeek').addEventListener('click', () => { weekStart = addDays(weekStart, -7); loadWeek(); });
document.getElementById('nextWeek').addEventListener('click', () => { weekStart = addDays(weekStart, 7); loadWeek(); });

loadWeek();
</script>
</body>
</html>
